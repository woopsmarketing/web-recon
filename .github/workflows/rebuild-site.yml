# Hosted site rebuild — builds ONE new package for a site that is already live, WITHOUT making it public.
#
# BoostChat's Super Admin creates the rebuild job and dispatches this workflow with the job id and the commit to run.
# The runner (platform/cli/site-rebuild.ts --run) claims the job, gets the spec from BoostChat, and does:
# validate -> scaffold (starter, brand, indexing) -> fetch the brand images -> build -> package check -> upload,
# read back and seal. It stops there. The package it seals is not served by anything until BoostChat's own
# activation step moves the pointer; this workflow has no step that does that, by design.
# Contract: boost-chat docs/work/site-design-platform/CONTRACTS.md section 9. Test: platform/test/rebuild-runner.test.ts.
#
# RULES OF THIS FILE (platform/test/rebuild-runner.test.ts checks them):
#   - An input never appears inside a `run:` script. Inputs reach a process ONLY through `env:` or `with:`;
#     the scripts below contain no ${{ }} at all.
#   - Secrets are mapped on the ONE step that needs them.
#   - Third-party actions are pinned to a full commit SHA.
#   - Nothing from the checkout runs before the commit is proven to be ON THE TRUSTED BRANCH: `source_ref`
#     must be a full commit SHA, and that commit must be the branch's head or one of its ancestors.
#   - No step of this file changes what visitors see: the only credentials it holds are the bucket's object
#     read/write token and the BoostChat publisher token; there is no zone credential at all.
name: rebuild-site

on:
  workflow_dispatch:
    inputs:
      rebuild_id:
        description: BoostChat rebuild job id (a lowercase UUID).
        type: string
        required: true
      source_ref:
        description: The full commit SHA (40 hex) the runner is checked out at. It must be on the trusted branch.
        type: string
        required: true

permissions:
  contents: read

# One run per job: a re-dispatch of the same job queues behind the running one instead of racing it.
concurrency:
  group: rebuild-${{ inputs.rebuild_id }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the runner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      # The trusted branch is a constant of this file (it is read from the default branch).
      # compare/<branch>...<sha> answers "identical" (the head) or "behind" (an ancestor) for a commit of
      # the branch, and "ahead" / "diverged" for anything else.
      - name: Refuse a commit that is not on the trusted branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          TRUSTED_BRANCH: portfolio-v2/incremental-runtime
        run: |
          head="$(git rev-parse HEAD)"
          if ! printf '%s' "$SOURCE_REF" | grep -Eq '^[0-9a-f]{40}$' || [ "$SOURCE_REF" != "$head" ]; then
            echo "refused: source_ref must be the full commit SHA that was checked out"
            exit 1
          fi
          status="$(gh api "repos/$REPOSITORY/compare/$TRUSTED_BRANCH...$head" --jq .status)"
          case "$status" in
            identical|behind) echo "ok: $head is on $TRUSTED_BRANCH ($status)" ;;
            *) echo "refused: $head is not on $TRUSTED_BRANCH ($status)"; exit 1 ;;
          esac

      - name: Set up Node 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          package-manager-cache: false

      # pnpm is installed NEXT TO node on purpose (see the note in provision-site.yml): the site builder runs
      # `pnpm` with an allowlisted PATH, and pnpm/action-setup would move pnpm's store.
      - name: Install pnpm 11.21.0 next to node
        run: |
          npm install --global --no-fund --no-audit pnpm@11.21.0
          test "$(dirname "$(command -v pnpm)")" = "$(dirname "$(command -v node)")"
          pnpm --version

      - name: Locate the pnpm store
        id: store
        run: |
          store="$(env -i HOME="$HOME" PATH="$(dirname "$(command -v node)"):/usr/bin:/bin" pnpm store path)"
          echo "path=$store" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'data/template-releases/**/files/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install the platform
        run: pnpm install --frozen-lockfile

      # The site build installs every release workspace OFFLINE from the release's own lockfile. This fetches the
      # packages and runs the builder's exact offline install as a proof, before any job is claimed.
      - name: Prime the store for the offline site build
        run: node_modules/.bin/tsx --tsconfig platform/tsconfig.json platform/provision/prime-store.ts

      - name: Rebuild the site of the job
        env:
          REBUILD_ID: ${{ inputs.rebuild_id }}
          REBUILD_SOURCE_REF: ${{ inputs.source_ref }}
          BOOSTCHAT_BASE_URL: ${{ vars.BOOSTCHAT_BASE_URL }}
          BOOSTCHAT_PUBLISHER_TOKEN: ${{ secrets.BOOSTCHAT_PUBLISHER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECON_PUBLISH_ALLOW_REMOTE: "1"
        run: node_modules/.bin/tsx --tsconfig platform/tsconfig.json platform/cli/site-rebuild.ts --run --rebuild-id "$REBUILD_ID"
