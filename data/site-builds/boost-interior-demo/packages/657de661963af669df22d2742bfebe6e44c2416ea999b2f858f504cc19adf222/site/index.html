" width="2000" height="600" alt="" loading="lazy" decoding="async"/></div><h2 id="i1-reviews-title" class="i1-reviews__title">고객 후기</h2><div class="i1-track i1-track--reviews" data-track="" data-scrollable="true"><ul id="i1-reviews-list" class="i1-track__list" aria-label="고객 후기" tabindex="0"><li class="i1-review" data-review="rv-white-care"><figure class="i1-review__figure"><p class="i1-review__index" aria-hidden="true">01</p><blockquote class="i1-review__quote"><p>화이트 인테리어는 관리가 어렵다고 들어서 망설였는데, 오염에 강한 마감재부터 제안해 주셔서 마음 놓고 결정했습니다. 살아 보니 청소가 오히려 쉬워요.</p></blockquote><figcaption class="i1-review__by">34평 아파트 · 4인 가족</figcaption></figure></li><li class="i1-review" data-review="rv-kitchen-flow"><figure class="i1-review__figure"><p class="i1-review__index" aria-hidden="true">02</p><blockquote class="i1-review__quote"><p>주방 동선을 다시 짜 주신 덕분에 요리할 때 걷는 걸음이 확 줄었어요. 도면으로 동선을 미리 보여 주셔서 이해하기 쉬웠습니다.</p></blockquote><figcaption class="i1-review__by">29평 아파트 · 맞벌이 부부</figcaption></figure></li><li class="i1-review" data-review="rv-entrance-bench"><figure class="i1-review__figure"><p class="i1-review__index" aria-hidden="true">03</p><blockquote class="i1-review__quote"><p>현관에 벤치와 수납을 만든 뒤로 아이들 가방과 신발이 거실까지 들어오지 않아요. 작은 변화인데 매일 체감합니다.</p></blockquote><figcaption class="i1-review__by">42평 아파트 · 5인 가족</figcaption></figure></li><li class="i1-review" data-review="rv-budget-priority"><figure class="i1-review__figure"><p class="i1-review__index" aria-hidden="true">04</p><blockquote class="i1-review__quote"><p>예산 안에서 꼭 해야 할 공사와 나중에 해도 되는 공사를 나눠 설명해 주신 점이 좋았습니다. 덕분에 욕실과 주방에 집중할 수 있었어요.</p></blockquote><figcaption class="i1-review__by">32평 아파트 · 3인 가족</figcaption></figure></li><li class="i1-review" data-review="rv-small-home"><figure class="i1-review__figure"><p class="i1-review__index" aria-hidden="true">05</p><blockquote class="i1-review__quote"><p>작은 평수라 기대가 크지 않았는데, 붙박이장에 짐을 다 넣고 나니 거실이 이렇게 넓었나 싶어요.</p></blockquote><figcaption class="i1-review__by">19평 아파트 · 1인 가구</figcaption></figure></li><l
